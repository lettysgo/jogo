<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomy Park</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #090304;
      font-family: "Courier New", monospace;
    }

    .game-shell {
      position: relative;
      width: min(100vw, 960px);
      aspect-ratio: 3 / 2;
      background: #120506;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      outline: none;
    }

    .hud {
      position: absolute;
      left: 16px;
      bottom: 14px;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }

    .hud span {
      display: grid;
      place-items: center;
      min-width: 34px;
      height: 30px;
      padding: 0 8px;
      border: 2px solid #fff1d2;
      background: rgba(5, 2, 4, 0.7);
      color: #fff1d2;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 3px 0 #4d1116;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <canvas id="game" width="960" height="640" aria-label="Jogo Anatomy Park"></canvas>
    <div class="hud" aria-hidden="true">
      <span>A</span>
      <span>D</span>
      <span>Espaco</span>
      <span>Shift</span>
      <span>F</span>
      <span>G</span>
      <span>Mouse</span>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const W = canvas.width;
    const H = canvas.height;
    const keys = new Set();
    const shots = [];
    const grenades = [];
    const bursts = [];
    const bloodClots = [];
    const monocytePickups = [];
    const macrophages = [];
    const neuralCapsules = [];
    const axons = [];
    const message = { title: "", lines: [], button: "", active: false, done: null };
    const heartImage = new Image();
    heartImage.src = "ccoração.gif";
    const heartBattleImage = new Image();
    heartBattleImage.src = "coracao_dentro.png";
    const macrophageImage = new Image();
    macrophageImage.src = "macrofago.png";
    const tracheaImage = new Image();
    tracheaImage.src = "traqueia_final.png";
    const esophagusImage = new Image();
    esophagusImage.src = "esofago_final.png";
    const aortaImage = new Image();
    aortaImage.src = "aorta.png";
    const nasalCavityImage = new Image();
    nasalCavityImage.src = "cavidade_nariz.png";
    const bloodImage = new Image();
    bloodImage.src = "sangue.png";
    const alveoliImage = new Image();
    alveoliImage.src = "alveolos_pulmonares.png";
    const gastricJuiceImage = new Image();
    gastricJuiceImage.src = "suco_gastrico.png";
    const brainArrivalImage = new Image();
    brainArrivalImage.src = "cerebro2.png";
    const coverImage = new Image();
    coverImage.src = "capa2.png";
    const humanImage = new Image();
    humanImage.src = "humano.png";
    const labShrinkFrames = [
      makeImage("lab_frames/lab1.png"),
      makeImage("lab_frames/lab2.png"),
      makeImage("lab_frames/lab3.png"),
      makeImage("lab_frames/lab4.png"),
      makeImage("lab_frames/lab5.png"),
      makeImage("lab_frames/lab6.png")
    ];
    const brainNeuronSprites = [
      makeImage("neuronio_1.png"),
      makeImage("neuronio_2.png"),
      makeImage("neuronio_3.png")
    ];
    const scientistImage = new Image();
    scientistImage.src = "cientista.png";
    const scientistBeakerImage = new Image();
    scientistBeakerImage.src = "cientista_becker.png";
    const scientistIdleImage = makeImage("cientista_parado.png");
    const scientistWalkImages = [
      makeImage("cientista_andando_1.png"),
      makeImage("cientista_andando_2.png"),
      makeImage("cientista_andando_3.png"),
      makeImage("cientista_andando_4.png"),
      makeImage("cientista_andando_5.png"),
      makeImage("cientista_andando_6.png")
    ];
    const tbSprites = [
      makeImage("virus_vermelho.png"),
      makeImage("virus_azul.png"),
      makeImage("virus_verde.png"),
      makeImage("virus_roxo.png")
    ];
    const trypWalkSprites = [
      makeImage("tryp_and_1.png"),
      makeImage("tryp_and_2.png"),
      makeImage("tryp_and_3.png"),
      makeImage("tryp_and_4.png")
    ];
    const trypSlamSprites = [
      makeImage("tryp_bat_1.png"),
      makeImage("tryp_bat_2.png"),
      makeImage("tryp_bat_3.png")
    ];
    const GRAVITY = 1380;
    const JUMP_FORCE = -610;
    const FLOOR_Y = 392;
    const HEART_FLOOR_Y = 500;
    const HEART_BOSS_Y = HEART_FLOOR_Y + 82;
    const HEART_ARENA_MIN_X = 72;
    const HEART_ARENA_MAX_X = 890;
    const STOMACH_SPAWN_X = 54;
    const STOMACH_LEDGE_Y = 360;
    const STOMACH_ARENA_MIN_X = 20;
    const STOMACH_ARENA_MAX_X = W - 20;
    const STOMACH_LEFT_LEDGE_END = 160;
    const STOMACH_RIGHT_LEDGE_START = 800;
    const BRAIN_ARRIVAL_FLOOR_Y = 450;

    const scientist = {
      x: 126,
      y: 392,
      w: 78,
      h: 142,
      baseSpeed: 245,
      vy: 0,
      onGround: true,
      previousY: 392,
      slowUntil: 0,
      facing: 1,
      step: 0,
      leucocytes: 0,
      monocytes: 0
    };

    const mucus = [
      { x: 420, y: 472, r: 19, vx: 34, phase: 0 },
      { x: 380, y: 490, r: 15, vx: -26, phase: 2.1 },
      { x: 765, y: 158, r: 17, vx: -22, phase: 1.2 },
      { x: 804, y: 190, r: 12, vx: 28, phase: 3.4 }
    ];

    const phase1Viruses = [
      makeVirus(810, 128, 27, -48, 24, "#71b6c5", "#c33b48"),
      makeVirus(720, 505, 29, 54, -20, "#96b63b", "#516915"),
      makeVirus(560, 135, 25, -36, 28, "#8d58b5", "#4d2a73")
    ];

    const tbEnemies = [
      makeTb(730, 405, -40, 18, 0),
      makeTb(595, 300, 35, -22, 1),
      makeTb(830, 250, -32, 24, 2),
      makeTb(455, 445, 28, -16, 3)
    ];

    const leucocytePickups = [
      { x: 260, y: 505, r: 16, taken: false },
      { x: 395, y: 496, r: 16, taken: false },
      { x: 535, y: 508, r: 16, taken: false },
      { x: 690, y: 500, r: 16, taken: false }
    ];

    const sporePlatforms = [
      { x: 215, y: 464, r: 31, phase: 0 },
      { x: 400, y: 410, r: 32, phase: 1.4 },
      { x: 595, y: 462, r: 33, phase: 2.1 },
      { x: 790, y: 418, r: 32, phase: 3.2 }
    ];

    let phase = 1;
    let gameStarted = false;
    let last = 0;
    let dead = false;
    let transitionTime = 0;
    let outroShown = false;
    let phase3OutroShown = false;
    let bloodSegment = 1;
    let onRaft = false;
    let raft = { x: 168, y: 430, vx: 0, stuck: false };
    let heartReached = false;
    let heartBoss = makeChagasBoss();
    let heartWon = false;
    let screenShake = 0;
    let brainStage = "diagnosis";
    let neuralScan = 0;
    let neuralImpulse = 0;
    let neuralMaterials = { lipids: 0, proteins: 0, atp: 0 };
    let oligodendrocyte = { x: 120, y: 420, r: 24 };
    let activeBrainRepairIndex = null;
    let brainGlowIndex = null;
    const brainRepairNodes = [
      { x: 275, y: 345, r: 62, sprite: 0, repaired: false },
      { x: 510, y: 345, r: 62, sprite: 1, repaired: false },
      { x: 825, y: 345, r: 62, sprite: 2, repaired: false }
    ];

    function makeImage(src) {
      const image = new Image();
      image.src = src;
      return image;
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (["a", "d", "f", "g", " ", "enter", "shift"].includes(key)) {
        event.preventDefault();
      }

      if (!gameStarted && (key === " " || key === "enter")) {
        startGameFromCover();
        return;
      }

      if ((phase === "labIntro" && !message.active) || phase === "humanIntro" || phase === "earExit") return;

      if (phase === "win" && (key === " " || key === "enter")) {
        gameStarted = false;
        phase = 1;
        return;
      }

      if (key === "a" || key === "d") keys.add(key);

      if (dead && (key === " " || key === "enter")) {
        resetGame();
        return;
      }

      if (message.active && (key === " " || key === "enter")) {
        const done = message.done;
        message.active = false;
        message.done = null;
        if (done) done();
        return;
      }

      if (key === " " && !message.active && !dead && phase !== "transition" && phase !== "returning" && phase !== "esophagus" && phase !== "absorbing" && phase !== 4) {
        jumpScientist();
      }

      if (phase === 4 && key === "shift" && !message.active && !dead) {
        enterRaft();
      }

      if (phase === 2 && key === "f" && !message.active && !dead) {
        collectLeucocyte();
      }

      if (phase === 6 && key === "g" && !message.active && !dead) {
        collectNeuralMaterial();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    canvas.addEventListener("mousedown", (event) => {
      if (!gameStarted) {
        const target = mousePoint(event);
        if (pointInPlayButton(target)) startGameFromCover();
        return;
      }

      if (phase === "labIntro" || phase === "humanIntro" || phase === "earExit" || phase === "win") return;

      if (dead || message.active || phase === "transition" || phase === "returning" || phase === "esophagus" || phase === "absorbing" || phase === "heartIntro") return;

      const target = mousePoint(event);
      if (event.button === 0 && phase === 1) {
        fireAntibiotic(target);
      }

      if (event.button === 0 && phase === 4 && onRaft) {
        fireAspirin(target);
      }

      if (event.button === 0 && phase === 6) {
        repairNearestAxon(target);
      }

      if (event.button === 2 && phase === 2) {
        throwLeucocyteGrenade(target);
      }

      if (event.button === 2 && phase === 5) {
        throwMonocyte(target);
      }
    });

    function makeVirus(x, y, r, vx, vy, color, spike) {
      return { x, y, r, vx, vy, color, spike, phase: Math.random() * 4, alive: true };
    }

    function makeTb(x, y, vx, vy, spriteIndex) {
      return { x, y, r: 29, vx, vy, spriteIndex, phase: Math.random() * 4, alive: true, hp: 1 };
    }

    function makeChagasBoss() {
      return {
        x: 828,
        y: HEART_BOSS_Y,
        r: 86,
        killR: 46,
        hp: 140,
        maxHp: 140,
        speed: 92,
        slamTimer: 1.85,
        slamWave: 0,
        slamPulled: false,
        facing: -1
      };
    }

    function mousePoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function playButtonRect() {
      return { x: W / 2 - 118, y: 512, w: 236, h: 70 };
    }

    function pointInPlayButton(point) {
      const button = playButtonRect();
      return point.x >= button.x && point.x <= button.x + button.w && point.y >= button.y && point.y <= button.y + button.h;
    }

    function startGameFromCover() {
      gameStarted = true;
      resetGame();
      phase = "labIntro";
      transitionTime = 0;
      showMessage(
        "A jornada pelo corpo humano",
        [
          "Sou o cientista responsavel pelo Anatomy Park. Hoje vamos explorar o corpo humano por dentro.",
          "Entraremos pelo nariz, passaremos pelos sistemas respiratorio, digestorio e circulatorio, ate chegar ao cerebro.",
          "La dentro, vamos combater invasores e reparar os circuitos neurais antes de voltar ao laboratorio."
        ],
        "ENTER para entrar na maquina",
        startHumanIntro
      );
    }

    function startHumanIntro() {
      phase = "humanIntro";
      transitionTime = 0;
    }

    function resetGame() {
      phase = 1;
      gameStarted = true;
      dead = false;
      transitionTime = 0;
      outroShown = false;
      phase3OutroShown = false;
      scientist.x = 126;
      scientist.y = FLOOR_Y;
      scientist.vy = 0;
      scientist.onGround = true;
      scientist.previousY = FLOOR_Y;
      scientist.slowUntil = 0;
      scientist.facing = 1;
      scientist.step = 0;
      scientist.leucocytes = 0;
      scientist.monocytes = 0;
      shots.length = 0;
      grenades.length = 0;
      bursts.length = 0;
      bloodClots.length = 0;
      monocytePickups.length = 0;
      macrophages.length = 0;
      neuralCapsules.length = 0;
      axons.length = 0;
      bloodSegment = 1;
      onRaft = false;
      raft = { x: 168, y: 430, vx: 0, stuck: false };
      heartReached = false;
      heartBoss = makeChagasBoss();
      heartWon = false;
      screenShake = 0;
      brainStage = "diagnosis";
      neuralScan = 0;
      neuralImpulse = 0;
      neuralMaterials = { lipids: 0, proteins: 0, atp: 0 };
      oligodendrocyte = { x: 120, y: 420, r: 24 };
      activeBrainRepairIndex = null;
      brainGlowIndex = null;
      brainRepairNodes.forEach((node) => node.repaired = false);
      phase1Viruses.splice(0, phase1Viruses.length,
        makeVirus(810, 128, 27, -48, 24, "#71b6c5", "#c33b48"),
        makeVirus(720, 505, 29, 54, -20, "#96b63b", "#516915"),
        makeVirus(560, 135, 25, -36, 28, "#8d58b5", "#4d2a73")
      );
      tbEnemies.splice(0, tbEnemies.length,
        makeTb(730, 405, -40, 18, 0),
        makeTb(595, 300, 35, -22, 1),
        makeTb(830, 250, -32, 24, 2),
        makeTb(455, 445, 28, -16, 3)
      );
      leucocytePickups.forEach((item) => item.taken = false);
      message.active = false;
      last = performance.now();
    }

    function showMessage(title, lines, button, done) {
      message.title = title;
      message.lines = lines;
      message.button = button;
      message.active = true;
      message.done = done || null;
    }

    function fireAntibiotic(target) {
      const start = beakerTip();
      const dir = normalize(target.x - start.x, target.y - start.y);
      shots.push({
        x: start.x,
        y: start.y,
        vx: dir.x * 520,
        vy: dir.y * 520,
        r: 8,
        life: 1.4
      });
    }

    function fireAspirin(target) {
      const start = { x: raft.x + 34, y: raft.y - 22 };
      const dir = normalize(target.x - start.x, target.y - start.y);
      shots.push({
        x: start.x,
        y: start.y,
        vx: dir.x * 560,
        vy: dir.y * 560,
        r: 9,
        life: 1.5,
        kind: "aspirin"
      });
    }

    function throwLeucocyteGrenade(target) {
      if (scientist.leucocytes <= 0) return;
      scientist.leucocytes -= 1;
      const start = beakerTip();
      const dir = normalize(target.x - start.x, target.y - start.y);
      grenades.push({
        x: start.x,
        y: start.y,
        vx: dir.x * 430,
        vy: dir.y * 430,
        r: 13,
        life: 1.7,
        spin: 0
      });
    }

    function throwMonocyte(target) {
      if (scientist.monocytes <= 0 || heartWon) return;
      scientist.monocytes -= 1;
      const start = beakerTip();
      const dir = normalize(target.x - start.x, target.y - start.y);
      grenades.push({
        x: start.x,
        y: start.y,
        vx: dir.x * 410,
        vy: dir.y * 410,
        r: 14,
        life: 1.5,
        spin: 0,
        kind: "monocyte"
      });
    }

    function beakerTip() {
      if (phase === 1) {
        return {
          x: scientist.x + (scientist.facing > 0 ? 96 : -16),
          y: scientist.y + 72
        };
      }

      return {
        x: scientist.x + (scientist.facing > 0 ? 78 : 4),
        y: scientist.y + 90
      };
    }

    function collectLeucocyte() {
      const player = playerCircle();
      leucocytePickups.forEach((item) => {
        if (!item.taken && circlesTouch(player, item)) {
          item.taken = true;
          scientist.leucocytes += 1;
          bursts.push(makeBurst(item.x, item.y, "#eaf7ff"));
        }
      });
    }

    function jumpScientist() {
      if (!scientist.onGround) return;
      scientist.vy = JUMP_FORCE;
      scientist.onGround = false;
    }

    function enterRaft() {
      if (onRaft) return;
      const closeEnough = Math.abs((scientist.x + scientist.w / 2) - raft.x) < 95 && Math.abs(scientist.y - 360) < 120;
      if (!closeEnough) return;
      onRaft = true;
      scientist.x = raft.x - scientist.w / 2;
      scientist.y = raft.y - scientist.h - 14;
      scientist.vy = 0;
      scientist.onGround = true;
      showMessage(
        "Hemacia-jangada",
        [
          "A hemacia e uma celula do sangue que transporta oxigenio pelo corpo.",
          "Aqui ela vira sua jangada: navegue pelos vasos ate chegar ao coracao.",
          "Coagulos de plaquetas podem travar a passagem. Use jatos de Acido Acetilsalicilico com o clique esquerdo."
        ],
        "ENTER para navegar",
        null
      );
    }

    function setupBloodSegment(segment) {
      bloodSegment = segment;
      raft = { x: 150, y: 420, vx: 0, stuck: false };
      onRaft = segment > 1;
      scientist.x = onRaft ? raft.x - scientist.w / 2 : 72;
      scientist.y = onRaft ? raft.y - scientist.h - 14 : 360;
      scientist.vy = 0;
      scientist.onGround = true;
      const clotLayouts = [
        [
          { x: 330, y: 395, r: 34 },
          { x: 470, y: 438, r: 40 },
          { x: 610, y: 360, r: 36 },
          { x: 760, y: 424, r: 42 }
        ],
        [
          { x: 285, y: 418, r: 36 },
          { x: 435, y: 350, r: 38 },
          { x: 585, y: 450, r: 42 },
          { x: 705, y: 365, r: 34 },
          { x: 835, y: 430, r: 38 }
        ],
        [
          { x: 260, y: 365, r: 34 },
          { x: 390, y: 445, r: 42 },
          { x: 535, y: 360, r: 38 },
          { x: 665, y: 430, r: 40 },
          { x: 805, y: 350, r: 36 },
          { x: 880, y: 455, r: 34 }
        ]
      ];
      bloodClots.splice(0, bloodClots.length, ...clotLayouts[segment - 1].map((clot) => ({ ...clot, alive: true })));
      monocytePickups.splice(0, monocytePickups.length,
        { x: 285, y: 352, r: 18, taken: false },
        { x: 545, y: 455, r: 18, taken: false },
        { x: 775, y: 380, r: 18, taken: false }
      );
      shots.length = 0;
    }

    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.04) || 0;
      last = now;

      if (!dead && !message.active) update(dt, now);
      draw(now);
      requestAnimationFrame(loop);
    }

    function update(dt, now) {
      if (phase === "labIntro") return;

      if (phase === "humanIntro") {
        transitionTime += dt;
        if (transitionTime > 9.4) {
          phase = 1;
          transitionTime = 0;
        }
        return;
      }

      if (phase === "earExit") {
        transitionTime += dt;
        if (transitionTime > 6.2) {
          phase = "win";
          transitionTime = 0;
        }
        return;
      }

      if (phase === "win") return;

      if (phase === "transition") {
        transitionTime += dt;
        if (transitionTime > 4.2) startPhase2();
        updateBursts(dt);
        return;
      }

      if (phase === "returning") {
        transitionTime += dt;
        if (transitionTime > 4.1) startEsophagusDrop();
        updateBursts(dt);
        return;
      }

      if (phase === "esophagus") {
        transitionTime += dt;
        if (transitionTime > 3.4) startPhase3();
        updateBursts(dt);
        return;
      }

      if (phase === "absorbing") {
        transitionTime += dt;
        if (transitionTime > 3.8) startBloodPhase();
        updateBursts(dt);
        return;
      }

      if (phase === "aorta") {
        transitionTime += dt;
        if (transitionTime > 4.2) startBrainArrival();
        updateBursts(dt);
        return;
      }

      if (phase === "brainArrival") {
        updateBrainArrival(dt, now);
        updateBursts(dt);
        return;
      }

      if (phase === "heartIntro") {
        transitionTime += dt;
        if (transitionTime > 3.2) enterHeartBattle();
        updateBursts(dt);
        return;
      }

      if (phase === 4) {
        updateBloodPhase(dt, now);
        return;
      }

      if (phase === 6) {
        updateBrainPhase(dt, now);
        return;
      }

      moveScientist(dt, now);
      updateProjectiles(dt);
      updateBursts(dt);
      if (screenShake > 0) screenShake -= dt;

      if (phase === 1) {
        updateMucus(dt, now);
        updateViruses(phase1Viruses, dt);
        handlePhase1Collisions(now);
        if (phase1Viruses.every((virus) => !virus.alive) && scientist.x > W - scientist.w - 46) {
          phase = "transition";
          transitionTime = 0;
          shots.length = 0;
        }
      }

      if (phase === 2) {
        updateTbEnemies(dt);
        handlePhase2Collisions();
        if (tbEnemies.every((enemy) => !enemy.alive) && !outroShown) {
          outroShown = true;
          showMessage(
            "Leucocitos",
            [
              "As granadas coletadas eram leucocitos: celulas de defesa do corpo.",
              "Eles reconhecem invasores, combatem microrganismos e ajudam a proteger os tecidos.",
              "Com os bacilos da tuberculose controlados, os alveolos voltam a trabalhar melhor."
            ],
            "ENTER para continuar",
            startReturnToEpiglottis
          );
        }
      }

      if (phase === 3) {
        handlePhase3Surfaces();
        if (scientist.y + scientist.h > 555) {
          dead = true;
        }
        const atStomachExit = scientist.x + scientist.w >= STOMACH_ARENA_MAX_X - 1;
        if (atStomachExit && keys.has("d") && scientist.onGround && !phase3OutroShown) {
          phase3OutroShown = true;
          showMessage(
            "Estomago atravessado",
            [
              "Voce cruzou o suco gastrico usando esporos resistentes como apoio.",
              "A microbiota e o conjunto de microrganismos que vivem no corpo e ajudam no equilibrio, defesa e digestao.",
              "Nem todo microrganismo e inimigo: o contexto e o equilibrio fazem muita diferenca."
            ],
            "ENTER para continuar",
            startAbsorption
          );
        }
      }

      if (phase === 5) {
        updateHeartBattle(dt, now);
      }

    }

    function moveScientist(dt, now) {
      const slowed = now < scientist.slowUntil;
      const speed = slowed ? scientist.baseSpeed * 0.42 : scientist.baseSpeed;
      let direction = 0;

      scientist.previousY = scientist.y;

      if (keys.has("a")) direction -= 1;
      if (keys.has("d")) direction += 1;

      if (direction !== 0) {
        scientist.facing = direction;
        scientist.x += direction * speed * dt;
        scientist.step += dt * (slowed ? 5 : 10);
      } else {
        scientist.step = 0;
      }

      if (phase === 5) {
        scientist.x = clamp(scientist.x, HEART_ARENA_MIN_X, HEART_ARENA_MAX_X - scientist.w);
      } else if (phase === 3) {
        scientist.x = clamp(scientist.x, STOMACH_ARENA_MIN_X, STOMACH_ARENA_MAX_X - scientist.w);
      } else {
        scientist.x = clamp(scientist.x, 42, W - scientist.w - 20);
      }

      scientist.vy += GRAVITY * dt;
      scientist.y += scientist.vy * dt;
      scientist.onGround = false;

      const groundY = phase === 5 ? HEART_FLOOR_Y : FLOOR_Y;
      if (phase !== 3 && scientist.y >= groundY) {
        scientist.y = groundY;
        scientist.vy = 0;
        scientist.onGround = true;
      }
    }

    function updateMucus(dt, now) {
      mucus.forEach((blob) => {
        blob.x += blob.vx * dt;
        blob.y += Math.sin(now / 420 + blob.phase) * 13 * dt;
        if (blob.x < 285 || blob.x > 865) blob.vx *= -1;
      });
    }

    function updateViruses(list, dt) {
      list.forEach((virus) => {
        if (!virus.alive) return;
        virus.x += virus.vx * dt;
        virus.y += virus.vy * dt;
        virus.phase += dt * 2.8;
        if (virus.x < 235 || virus.x > 895) virus.vx *= -1;
        if (virus.y < 105 || virus.y > 530) virus.vy *= -1;
      });
    }

    function updateTbEnemies(dt) {
      tbEnemies.forEach((enemy) => {
        if (!enemy.alive) return;
        enemy.x += enemy.vx * dt;
        enemy.y += enemy.vy * dt;
        enemy.phase += dt * 3;
        if (enemy.x < 250 || enemy.x > 890) enemy.vx *= -1;
        if (enemy.y < 220 || enemy.y > 510) enemy.vy *= -1;
      });
    }

    function updateProjectiles(dt) {
      [...shots, ...grenades].forEach((shot) => {
        shot.x += shot.vx * dt;
        shot.y += shot.vy * dt;
        shot.life -= dt;
        shot.spin += dt * 8;
      });

      removeDead(shots);
      removeDead(grenades);

      shots.forEach((shot) => {
        phase1Viruses.forEach((virus) => {
          if (virus.alive && circlesTouch(shot, virus)) {
            shot.life = 0;
            virus.alive = false;
            bursts.push(makeBurst(virus.x, virus.y, virus.color));
          }
        });

        bloodClots.forEach((clot) => {
          if (phase === 4 && clot.alive && shot.kind === "aspirin" && circlesTouch(shot, clot)) {
            shot.life = 0;
            clot.alive = false;
            bursts.push(makeBurst(clot.x, clot.y, "#f5d6d6"));
          }
        });
      });

      grenades.forEach((grenade) => {
        tbEnemies.forEach((enemy) => {
          if (enemy.alive && circlesTouch(grenade, enemy)) {
            grenade.life = 0;
            enemy.alive = false;
            bursts.push(makeBurst(enemy.x, enemy.y, "#d7f6ff"));
          }
        });
      });
    }

    function removeDead(list) {
      for (let i = list.length - 1; i >= 0; i -= 1) {
        const shot = list[i];
        if (shot.life <= 0 || shot.x < -40 || shot.x > W + 40 || shot.y < -40 || shot.y > H + 40) {
          list.splice(i, 1);
        }
      }
    }

    function updateBursts(dt) {
      bursts.forEach((burst) => burst.life -= dt);
      for (let i = bursts.length - 1; i >= 0; i -= 1) {
        if (bursts[i].life <= 0) bursts.splice(i, 1);
      }
    }

    function handlePhase1Collisions(now) {
      const player = playerCircle();
      if (mucus.some((blob) => circlesTouch(player, blob))) {
        scientist.slowUntil = now + 1300;
      }

      if (phase1Viruses.some((virus) => virus.alive && circlesTouch(player, virus))) {
        dead = true;
      }
    }

    function handlePhase2Collisions() {
      const player = playerCircle();
      if (tbEnemies.some((enemy) => enemy.alive && circlesTouch(player, enemy))) {
        dead = true;
      }
    }

    function startPhase2() {
      phase = 2;
      scientist.x = 86;
      scientist.y = FLOOR_Y;
      scientist.vy = 0;
      scientist.onGround = true;
      scientist.facing = 1;
      scientist.leucocytes = 0;
      shots.length = 0;
      grenades.length = 0;
      showMessage(
        "Fase 2: Alveolos Pulmonares",
        [
          "Voce chegou aos alveolos, pequenos sacos do pulmao onde o oxigenio entra no sangue.",
          "A tuberculose nao e causada por virus: ela vem de uma bacteria chamada Mycobacterium tuberculosis.",
          "Ela pode inflamar o tecido pulmonar e atrapalhar a respiracao. Colete leucocitos com F e arremesse com o botao direito."
        ],
        "ENTER para lutar",
        null
      );
    }

    function startReturnToEpiglottis() {
      phase = "returning";
      transitionTime = 0;
      shots.length = 0;
      grenades.length = 0;
      bursts.length = 0;
    }

    function startEsophagusDrop() {
      phase = "esophagus";
      transitionTime = 0;
    }

    function startPhase3() {
      phase = 3;
      transitionTime = 0;
      phase3OutroShown = false;
      scientist.x = STOMACH_SPAWN_X;
      scientist.y = STOMACH_LEDGE_Y;
      scientist.vy = 0;
      scientist.onGround = true;
      scientist.facing = 1;
      showMessage(
        "Fase 3: Estomago",
        [
          "O suco gastrico e um liquido muito acido, com enzimas, que ajuda a quebrar alimentos e destruir muitos microrganismos.",
          "Esporos bacterianos, como os de Clostridium difficile, tem uma capa resistente e podem sobreviver melhor a acidez.",
          "Pule com ESPACO sobre os esporos para atravessar o lago. A microbiota e a comunidade de microrganismos que vive no corpo."
        ],
        "ENTER para atravessar",
        null
      );
    }

    function handlePhase3Surfaces() {
      const bottomBefore = scientist.previousY + scientist.h;
      const bottomNow = scientist.y + scientist.h;
      const centerX = scientist.x + scientist.w * 0.52;

      const overLeftLedge = centerX <= STOMACH_LEFT_LEDGE_END;
      const overRightLedge = centerX >= STOMACH_RIGHT_LEDGE_START;
      if ((overLeftLedge || overRightLedge) && scientist.y >= STOMACH_LEDGE_Y) {
        scientist.y = STOMACH_LEDGE_Y;
        scientist.vy = 0;
        scientist.onGround = true;
      }

      sporePlatforms.forEach((spore) => {
        const top = spore.y - spore.r * 0.72;
        const closeX = Math.abs(centerX - spore.x) < spore.r + 16;
        const fallingOntoTop = scientist.vy >= 0 && bottomBefore <= top + 18 && bottomNow >= top;

        if (closeX && fallingOntoTop) {
          scientist.y = top - scientist.h;
          scientist.vy = 0;
          scientist.onGround = true;
        }
      });
    }

    function startAbsorption() {
      phase = "absorbing";
      transitionTime = 0;
      shots.length = 0;
      grenades.length = 0;
      bursts.length = 0;
    }

    function startBloodPhase() {
      phase = 4;
      heartReached = false;
      setupBloodSegment(1);
      showMessage(
        "Nutriente no sangue",
        [
          "Depois de atravessar o estomago, o cientista foi absorvido como um nutriente e caiu na corrente sanguinea.",
          "Para viajar pelo sangue, encontre a hemacia e pressione SHIFT para subir nela.",
          "Passe por tres trechos de veias e arterias. Colete monocitos pelo caminho: eles poderao virar macrofagos em fases futuras."
        ],
        "ENTER para procurar a hemacia",
        null
      );
    }

    function updateBloodPhase(dt, now) {
      updateProjectiles(dt);
      updateBursts(dt);

      if (!onRaft) {
        const speed = 220;
        let direction = 0;
        if (keys.has("a")) direction -= 1;
        if (keys.has("d")) direction += 1;
        scientist.x += direction * speed * dt;
        scientist.x = clamp(scientist.x, 42, 250);
        scientist.y = 360;
        return;
      }

      let direction = 0;
      if (keys.has("a")) direction -= 1;
      if (keys.has("d")) direction += 1;

      raft.stuck = bloodClots.some((clot) => clot.alive && Math.abs(raft.x + 55 - clot.x) < clot.r + 50 && Math.abs(raft.y - clot.y) < clot.r + 40);
      const canMove = !(raft.stuck && direction > 0);
      if (canMove) {
        raft.x += direction * 235 * dt;
      }
      raft.y = 420 + Math.sin(now / 500 + bloodSegment) * 28;
      raft.x = clamp(raft.x, 70, W - 80);

      scientist.x = raft.x - scientist.w / 2;
      scientist.y = raft.y - scientist.h - 14;
      scientist.facing = direction !== 0 ? direction : scientist.facing;

      monocytePickups.forEach((item) => {
        if (!item.taken && circlesTouch({ x: raft.x, y: raft.y, r: 52 }, item)) {
          item.taken = true;
          scientist.monocytes += 1;
          bursts.push(makeBurst(item.x, item.y, "#d7ecff"));
        }
      });

      if (raft.x > W - 92 && !heartReached) {
        if (bloodSegment < 3) {
          setupBloodSegment(bloodSegment + 1);
        } else {
          heartReached = true;
          showMessage(
            "Chegada ao coracao",
            [
              "A hemacia-jangada chegou ao coracao depois de atravessar veias e arterias.",
              "As plaquetas ajudam a coagular quando ha ferimentos, mas em excesso podem formar trombos dentro dos vasos.",
              "Voce guardou " + scientist.monocytes + " monocitos. No tecido do coracao, eles poderao virar macrofagos."
            ],
            "ENTER para entrar no coracao",
            startHeartBattle
          );
        }
      }
    }

    function startHeartBattle() {
      phase = "heartIntro";
      transitionTime = 0;
      shots.length = 0;
      grenades.length = 0;
      bursts.length = 0;
    }

    function enterHeartBattle() {
      phase = 5;
      onRaft = false;
      heartWon = false;
      heartBoss = makeChagasBoss();
      macrophages.length = 0;
      shots.length = 0;
      grenades.length = 0;
      bursts.length = 0;
      scientist.x = 118;
      scientist.y = HEART_FLOOR_Y;
      scientist.vy = 0;
      scientist.onGround = true;
      scientist.facing = 1;
      showMessage(
        "Fase 4: Coracao",
        [
          "O coracao e um grande musculo que bombeia sangue para o corpo todo.",
          "A Doenca de Chagas e causada pelo protozoario Trypanosoma cruzi, um parasita que pode invadir celulas e afetar o musculo cardiaco.",
          "Com o tempo, ele pode inflamar e enfraquecer o coracao, prejudicando o bombeamento do sangue.",
          "Arremesse monocitos com o botao direito. Ao tocar o tecido muscular, eles viram macrofagos e atacam o parasita gigante."
        ],
        "ENTER para lutar",
        null
      );
    }

    function updateHeartBattle(dt, now) {
      updateMacrophages(dt, now);
      updateChagasBoss(dt);
      scientist.y = HEART_FLOOR_Y;
      scientist.vy = 0;
      scientist.onGround = true;

      grenades.forEach((grenade) => {
        if (grenade.kind === "monocyte" && grenade.y + grenade.r >= HEART_FLOOR_Y + scientist.h - 4) {
          macrophages.push({
            x: grenade.x,
            y: HEART_FLOOR_Y + scientist.h - 28,
            r: 22,
            attackTimer: 0.35,
            life: 9,
            phase: Math.random() * 4
          });
          grenade.life = 0;
          bursts.push(makeBurst(grenade.x, grenade.y, "#d7ecff"));
        }
      });

      if (circlesTouch(playerCircle(), { x: heartBoss.x, y: heartBoss.y, r: heartBoss.killR }) && !heartWon) {
        dead = true;
      }

      if (heartBoss.hp <= 0 && !heartWon) {
        heartWon = true;
        heartBoss.hp = 0;
        bursts.push(makeBurst(heartBoss.x, heartBoss.y, "#e9d6ff"));
        showMessage(
          "Macrofagos",
          [
            "Quando os monocitos saem da corrente sanguinea e entram nos tecidos, eles se diferenciam em macrofagos.",
            "Macrofagos sao celulas de defesa que englobam invasores, removem restos celulares e ajudam a organizar a resposta imune.",
            "Com o Trypanosoma cruzi controlado, o tecido muscular do coracao fica protegido."
          ],
          "ENTER para subir pela aorta",
          startAortaTransition
        );
      }
    }

    function updateChagasBoss(dt) {
      if (heartWon) return;
      const targetX = scientist.x + scientist.w / 2;
      const dir = Math.sign(targetX - heartBoss.x) || heartBoss.facing;
      heartBoss.facing = dir;
      heartBoss.x += dir * heartBoss.speed * dt;
      heartBoss.x = clamp(heartBoss.x, HEART_ARENA_MIN_X + 170, HEART_ARENA_MAX_X - 40);
      heartBoss.y = HEART_BOSS_Y;

      heartBoss.slamTimer -= dt;
      if (heartBoss.slamTimer <= 0) {
        heartBoss.slamTimer = 1.65;
        heartBoss.slamWave = 0.78;
        heartBoss.slamPulled = false;
        screenShake = 0.78;
      }

      if (heartBoss.slamWave > 0) {
        heartBoss.slamWave -= dt;
        const playerDist = Math.abs((scientist.x + scientist.w / 2) - heartBoss.x);
        if (playerDist < 360 && scientist.onGround && heartBoss.slamWave > 0.38) {
          scientist.slowUntil = performance.now() + 900;
          if (!heartBoss.slamPulled) {
            const pull = Math.sign(heartBoss.x - (scientist.x + scientist.w / 2)) || 1;
            scientist.x += pull * 58;
            scientist.x = clamp(scientist.x, HEART_ARENA_MIN_X, HEART_ARENA_MAX_X - scientist.w);
            scientist.y = HEART_FLOOR_Y;
            heartBoss.slamPulled = true;
          }
        }
      }
    }

    function updateMacrophages(dt, now) {
      macrophages.forEach((mac) => {
        mac.life -= dt;
        mac.phase += dt * 4;
        const dir = normalize(heartBoss.x - mac.x, heartBoss.y - mac.y);
        mac.x += dir.x * 105 * dt;
        mac.y += dir.y * 55 * dt;
        mac.attackTimer -= dt;

        if (!heartWon && circlesTouch(mac, heartBoss) && mac.attackTimer <= 0) {
          mac.attackTimer = 0.8;
          heartBoss.hp -= 12;
          bursts.push(makeBurst(heartBoss.x + (Math.random() - 0.5) * 55, heartBoss.y, "#f0dbff"));
        }
      });

      for (let i = macrophages.length - 1; i >= 0; i -= 1) {
        if (macrophages[i].life <= 0) macrophages.splice(i, 1);
      }
    }

    function startAortaTransition() {
      phase = "aorta";
      transitionTime = 0;
      shots.length = 0;
      grenades.length = 0;
      bursts.length = 0;
    }

    function startBrainArrival(showIntro = true) {
      phase = "brainArrival";
      transitionTime = 0;
      scientist.x = 46;
      scientist.y = BRAIN_ARRIVAL_FLOOR_Y - scientist.h;
      scientist.vy = 0;
      scientist.onGround = true;
      scientist.facing = 1;
      if (showIntro) {
        brainRepairNodes.forEach((node) => node.repaired = false);
        activeBrainRepairIndex = null;
        brainGlowIndex = null;
      }
      if (showIntro) {
        showMessage(
          "Chegada ao cerebro",
          [
            "Depois de subir pela aorta, voce chegou ao tecido cerebral.",
            "Ande pela camada delimitada e encoste nos neuronios danificados para iniciar o reparo.",
            "Cada neuronio consertado some e envia um brilho de impulso eletrico pelo circuito."
          ],
          "ENTER para explorar",
          null
        );
      }
    }

    function updateBrainArrival(dt, now) {
      if (message.active || dead) return;
      let direction = 0;
      if (keys.has("a")) direction -= 1;
      if (keys.has("d")) direction += 1;
      scientist.x = clamp(scientist.x + direction * scientist.baseSpeed * dt, 36, W - scientist.w - 38);
      scientist.y = BRAIN_ARRIVAL_FLOOR_Y - scientist.h;
      scientist.vy = 0;
      scientist.onGround = true;
      if (direction !== 0) {
        scientist.facing = direction;
        scientist.step += dt * 10;
      } else {
        scientist.step = 0;
      }

      const playerX = scientist.x + scientist.w / 2;
      const targetIndex = brainRepairNodes.findIndex((node) => !node.repaired && Math.abs(playerX - node.x) < 86);
      if (targetIndex >= 0) startBrainPhase(targetIndex);
    }

    function startBrainPhase(nodeIndex = null) {
      phase = 6;
      activeBrainRepairIndex = nodeIndex;
      brainStage = "diagnosis";
      neuralScan = 0;
      neuralImpulse = 0;
      neuralMaterials = { lipids: 0, proteins: 0, atp: 0 };
      oligodendrocyte = { x: 120, y: 420, r: 24 };
      scientist.x = 70;
      scientist.y = FLOOR_Y;
      scientist.vy = 0;
      scientist.onGround = true;
      setupBrainObjects();
    }

    function setupBrainObjects() {
      axons.splice(0, axons.length,
        { x: 200, y: 210, w: 560, damaged: false, repair: 1, angle: 0 },
        { x: 170, y: 315, w: 620, damaged: true, repair: 0, angle: 0 },
        { x: 240, y: 420, w: 520, damaged: true, repair: 0, angle: 0 },
        { x: 160, y: 520, w: 650, damaged: false, repair: 1, angle: 0 }
      );
      neuralCapsules.splice(0, neuralCapsules.length,
        { x: 125, y: 470, type: "lipids", color: "#f4d34f", label: "L", taken: false },
        { x: 215, y: 505, type: "proteins", color: "#f07c2b", label: "P", taken: false },
        { x: 305, y: 468, type: "atp", color: "#56d36a", label: "A", taken: false },
        { x: 395, y: 505, type: "lipids", color: "#f4d34f", label: "L", taken: false },
        { x: 485, y: 472, type: "proteins", color: "#f07c2b", label: "P", taken: false },
        { x: 575, y: 508, type: "atp", color: "#56d36a", label: "A", taken: false },
        { x: 665, y: 472, type: "lipids", color: "#f4d34f", label: "L", taken: false },
        { x: 755, y: 505, type: "proteins", color: "#f07c2b", label: "P", taken: false },
        { x: 845, y: 468, type: "atp", color: "#56d36a", label: "A", taken: false }
      );
    }

    function updateBrainPhase(dt, now) {
      if (screenShake > 0) screenShake -= dt;
      if (brainStage === "diagnosis") {
        neuralScan += dt;
        if (neuralScan > 3.2) {
          brainStage = "collect";
          showMessage(
            "Coleta de materiais",
            [
              "Agora voce vai juntar os recursos usados para reconstruir a bainha de mielina.",
              "Lipideos formam a parte gordurosa da mielina; proteinas ajudam na estrutura; ATP fornece energia celular.",
              "Colete as capsulas com G. Voce pode continuar coletando mesmo durante o reparo, se faltar material."
            ],
            "ENTER para coletar",
            null
          );
        }
      }

      if (brainStage === "collect" || brainStage === "repair") {
        let direction = 0;
        if (keys.has("a")) direction -= 1;
        if (keys.has("d")) direction += 1;
        oligodendrocyte.x = clamp(oligodendrocyte.x + direction * 235 * dt, 70, W - 70);
        oligodendrocyte.y = 420 + Math.sin(now / 350) * 18;
        if (hasAnyNeuralMaterial()) brainStage = "repair";
      }

      if (brainStage === "test") {
        neuralImpulse += dt * 0.28;
        if (neuralImpulse > 1.15) {
          brainStage = "done";
          if (activeBrainRepairIndex !== null && brainRepairNodes[activeBrainRepairIndex]) {
            brainRepairNodes[activeBrainRepairIndex].repaired = true;
            brainGlowIndex = activeBrainRepairIndex;
          }
          const remaining = brainRepairNodes.filter((node) => !node.repaired).length;
          showMessage(
            "Impulso restaurado",
            [
              "O reparo representa o oligodendrocito enrolando novas camadas de mielina ao redor do axonio.",
              "Com a cobertura fechada, o impulso eletrico volta a seguir pelo caminho certo e com mais velocidade.",
              remaining > 0 ? "Volte ao tecido cerebral e procure o proximo neuronio danificado." : "Todos os neuronios danificados desta area foram reparados."
            ],
            remaining > 0 ? "ENTER para voltar ao cerebro" : "ENTER para sair pela orelha",
            () => {
              activeBrainRepairIndex = null;
              if (remaining > 0) {
                startBrainArrival(false);
              } else {
                phase = "earExit";
                transitionTime = 0;
              }
            }
          );
        }
      }
    }

    function collectNeuralMaterial() {
      if (phase !== 6 || (brainStage !== "collect" && brainStage !== "repair")) return;
      neuralCapsules.forEach((item) => {
        if (!item.taken && circlesTouch({ x: oligodendrocyte.x, y: oligodendrocyte.y, r: 72 }, { x: item.x, y: item.y, r: 30 })) {
          item.taken = true;
          neuralMaterials[item.type] += 1;
          bursts.push(makeBurst(item.x, item.y, item.color));
        }
      });
    }

    function repairNearestAxon(target) {
      if (phase !== 6 || brainStage !== "repair" || !hasAnyNeuralMaterial()) return;
      const targetAxon = axons.find((axon) => axon.damaged && axon.repair < 1 && pointNearAxon(target, axon));
      if (!targetAxon) return;
      spendOneNeuralMaterial();
      targetAxon.repair = clamp(targetAxon.repair + 0.5, 0, 1);
      targetAxon.angle += Math.PI / 2;
      bursts.push(makeBurst(target.x, target.y, "#9ed8ff"));
      if (axons.every((axon) => !axon.damaged || axon.repair >= 1)) {
        brainStage = "test";
        neuralImpulse = 0;
      }
    }

    function pointNearAxon(point, axon) {
      return point.x > axon.x - 50 && point.x < axon.x + axon.w + 50 && Math.abs(point.y - axon.y) < 64;
    }

    function hasNeuralMaterials() {
      return neuralMaterials.lipids > 0 && neuralMaterials.proteins > 0 && neuralMaterials.atp > 0;
    }

    function hasAnyNeuralMaterial() {
      return neuralMaterials.lipids + neuralMaterials.proteins + neuralMaterials.atp > 0;
    }

    function spendOneNeuralMaterial() {
      if (neuralMaterials.lipids > 0) {
        neuralMaterials.lipids -= 1;
      } else if (neuralMaterials.proteins > 0) {
        neuralMaterials.proteins -= 1;
      } else if (neuralMaterials.atp > 0) {
        neuralMaterials.atp -= 1;
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, W, H);

      if (!gameStarted) {
        drawCoverScreen(now);
        return;
      }

      if (phase === "labIntro") drawLabIntro(now);
      if (phase === "humanIntro") drawHumanIntro(now);
      if (phase === "earExit") drawEarExit(now);
      if (phase === "win") drawWinScreen(now);
      if (phase === 1) drawPhase1Background(now);

    function drawNeuronImpulseGlow(node, now) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const spark = 0.8 + Math.sin(now / 110) * 0.2;
      ctx.strokeStyle = "rgba(255, 232, 66, 0.92)";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 5;
      const branches = 12;
      for (let i = 0; i < branches; i += 1) {
        const angle = -Math.PI / 2 + (i - branches / 2) * 0.42 + Math.sin(now / 310 + i) * 0.08;
        const len = 44 + (i % 4) * 13 + Math.sin(now / 150 + i * 1.7) * 7;
        const midX = node.x + Math.cos(angle) * len * 0.55 + Math.sin(i * 2.1) * 10;
        const midY = node.y + Math.sin(angle) * len * 0.55 + Math.cos(i * 1.6) * 9;
        const endX = node.x + Math.cos(angle) * len;
        const endY = node.y + Math.sin(angle) * len;
        ctx.globalAlpha = 0.55 + spark * 0.35;
        ctx.beginPath();
        ctx.moveTo(node.x, node.y);
        ctx.quadraticCurveTo(midX, midY, endX, endY);
        ctx.stroke();

        const branchAngle = angle + (i % 2 === 0 ? 0.65 : -0.65);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(midX, midY);
        ctx.lineTo(midX + Math.cos(branchAngle) * 24, midY + Math.sin(branchAngle) * 24);
        ctx.stroke();
        ctx.lineWidth = 5;
      }
      ctx.restore();

      circle(spore.x + 5, y + 7, spore.r + 5);
      ctx.fillStyle = "#b37b3e";
      ctx.beginPath();
      ctx.ellipse(spore.x, y, spore.r * 1.25, spore.r * 0.72, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e0b767";
      ctx.beginPath();
      ctx.ellipse(spore.x - 9, y - 6, spore.r * 0.52, spore.r * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#6e4929";
      ctx.fillRect(spore.x - spore.r * 0.75, y + 2, spore.r * 1.5, 8);
    }

    function drawRaft(now, overrideX, overrideY) {
      const x = overrideX ?? raft.x;
      const y = overrideY ?? raft.y;
      ctx.fillStyle = "#501018";
      ctx.beginPath();
      ctx.ellipse(x + 4, y + 8, 78, 43, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#d82f35";
      ctx.beginPath();
      ctx.ellipse(x, y, 76, 42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f36a5f";
      ctx.beginPath();
      ctx.ellipse(x - 16, y - 10, 34, 15, -0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#74131b";
      ctx.beginPath();
      ctx.ellipse(x + 12, y + 4, 34, 17, 0.2, 0, Math.PI * 2);
      ctx.fill();
      if (!onRaft && phase === 4) {
        ctx.fillStyle = "#fff1d2";
        ctx.font = "bold 16px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText("SHIFT", x, y - 58);
      }
    }

    function drawMiniRaft(x, y, scale, now) {
      ctx.save();
      ctx.translate(x, y + Math.sin(now / 260) * 3 * scale);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#501018";
      ctx.beginPath();
      ctx.ellipse(4, 8, 78, 43, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#d82f35";
      ctx.beginPath();
      ctx.ellipse(0, 0, 76, 42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f36a5f";
      ctx.beginPath();
      ctx.ellipse(-16, -10, 34, 15, -0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#74131b";
      ctx.beginPath();
      ctx.ellipse(12, 4, 34, 17, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawClot(clot, now) {
      ctx.fillStyle = "#451018";
      circle(clot.x + 6, clot.y + 7, clot.r + 8);
      ctx.fillStyle = "#7a2630";
      circle(clot.x, clot.y, clot.r);
      ctx.fillStyle = "#b45a61";
      for (let i = 0; i < 8; i += 1) {
        circle(clot.x + Math.cos(i * 0.8 + now / 500) * clot.r * 0.55, clot.y + Math.sin(i * 0.8) * clot.r * 0.45, 9);
      }
      ctx.fillStyle = "#fff1d2";
      ctx.font = "bold 13px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText("COAGULO", clot.x, clot.y - clot.r - 16);
    }

    function drawMonocyte(item, now) {
      ctx.fillStyle = "#172846";
      circle(item.x + 4, item.y + 4, item.r + 5);
      ctx.fillStyle = "#d7ecff";
      circle(item.x, item.y + Math.sin(now / 240 + item.x) * 5, item.r);
      ctx.fillStyle = "#7d9fc8";
      ctx.beginPath();
      ctx.ellipse(item.x - 3, item.y, 11, 7, 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMacrophage(mac, now) {
      if (macrophageImage.complete && macrophageImage.naturalWidth > 0) {
        const size = mac.r * 3.8 + Math.sin(now / 180 + mac.phase) * 5;
        ctx.save();
        ctx.translate(mac.x, mac.y);
        ctx.rotate(Math.sin(now / 420 + mac.phase) * 0.18);
        ctx.drawImage(macrophageImage, -size / 2, -size / 2, size, size);
        ctx.restore();
        return;
      }

      ctx.fillStyle = "#1e2745";
      circle(mac.x + 5, mac.y + 6, mac.r + 6);
      ctx.fillStyle = "#d8f0ff";
      circle(mac.x, mac.y + Math.sin(now / 180 + mac.phase) * 4, mac.r);
      ctx.fillStyle = "#89a9d5";
      circle(mac.x - 7, mac.y - 2, 8);
      circle(mac.x + 8, mac.y + 5, 7);
      ctx.strokeStyle = "#d8f0ff";
      ctx.lineWidth = 7;
      for (let i = 0; i < 5; i += 1) {
        const angle = i * 1.25 + mac.phase;
        ctx.beginPath();
        ctx.moveTo(mac.x, mac.y);
        ctx.lineTo(mac.x + Math.cos(angle) * 31, mac.y + Math.sin(angle) * 24);
        ctx.stroke();
      }
    }

    function drawChagasBoss(now) {
      if (heartWon && heartBoss.hp <= 0) return;
      const isSlamming = heartBoss.slamWave > 0;
      const slamProgress = clamp((0.78 - heartBoss.slamWave) / 0.78, 0, 0.999);
      const slamFrame = trypSlamSprites[Math.floor(slamProgress * trypSlamSprites.length)];
      const walkFrame = trypWalkSprites[Math.floor(now / 140) % trypWalkSprites.length];
      const sprite = isSlamming ? slamFrame : walkFrame;

      ctx.save();
      ctx.translate(heartBoss.x, heartBoss.y);
      ctx.scale(-heartBoss.facing, 1);

      if (sprite && sprite.complete && sprite.naturalWidth > 0) {
        const height = isSlamming ? 304 : 284;
        const width = height * (sprite.naturalWidth / sprite.naturalHeight);
        const transparentBottom = isSlamming ? 28 : 24;
        ctx.drawImage(sprite, -width / 2, -height + 54 + transparentBottom, width, height);
      } else {
        ctx.strokeStyle = "#2b1024";
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(-60, 0);
        ctx.bezierCurveTo(-150, -58, -125, 82, -36, 52);
        ctx.stroke();

        ctx.fillStyle = "#542160";
        ctx.beginPath();
        ctx.ellipse(0, 0, 70, 46, 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#9e4ca7";
        ctx.beginPath();
        ctx.ellipse(-6, -7, 50, 27, 0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f2d45f";
        circle(28, -8, 9);
        circle(8, 12, 7);

        ctx.strokeStyle = "#301128";
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(55, 3);
        ctx.bezierCurveTo(120, -46, 140, 45, 62, 34);
        ctx.stroke();

        ctx.fillStyle = "#2b1024";
        ctx.fillRect(-18, -20, 18, 10);
        ctx.fillRect(22, 12, 18, 10);
      }
      ctx.restore();

      if (heartBoss.slamWave > 0.35) {
        ctx.fillStyle = "#ffe2ae";
        ctx.font = "bold 18px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText("PANCADA!", heartBoss.x, heartBoss.y - 80);
      }
    }

    function drawBossBar() {
      const w = 380;
      const x = W / 2 - w / 2;
      const y = 86;
      const pct = clamp(heartBoss.hp / heartBoss.maxHp, 0, 1);
      ctx.fillStyle = "rgba(12, 3, 7, 0.82)";
      ctx.fillRect(x, y, w, 32);
      ctx.fillStyle = "#11351c";
      ctx.fillRect(x + 6, y + 6, w - 12, 20);
      ctx.fillStyle = "#34d15b";
      ctx.fillRect(x + 6, y + 6, (w - 12) * pct, 20);
      ctx.fillStyle = "#fff1d2";
      ctx.font = "bold 15px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText("Trypanosoma cruzi", W / 2, y - 8);
    }

    function drawAxon(axon, now) {
      const repaired = !axon.damaged || axon.repair >= 1;
      ctx.strokeStyle = repaired ? "#4dbdff" : "#f0444d";
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(axon.x, axon.y);
      ctx.bezierCurveTo(axon.x + axon.w * 0.28, axon.y - 28, axon.x + axon.w * 0.62, axon.y + 32, axon.x + axon.w, axon.y);
      ctx.stroke();

      const segments = 9;
      for (let i = 0; i < segments; i += 1) {
        const pct = i / (segments - 1);
        const x = axon.x + axon.w * pct;
        const y = axon.y + Math.sin(pct * Math.PI * 2) * 18;
        const covered = repaired || i / segments < axon.repair;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(axon.angle + pct * 0.8);
        ctx.fillStyle = covered ? "#f6d67a" : "rgba(240, 68, 77, 0.22)";
        ctx.fillRect(-18, -15, 36, 30);
        ctx.restore();
      }

      if (axon.damaged && axon.repair < 1) {
        ctx.fillStyle = "#ffef7a";
        for (let i = 0; i < 5; i += 1) {
          const sparkX = axon.x + 80 + i * 95 + Math.sin(now / 90 + i) * 10;
          const sparkY = axon.y - 28 + Math.cos(now / 110 + i) * 16;
          ctx.fillRect(sparkX, sparkY, 8, 8);
        }
        ctx.fillStyle = "#fff1d2";
        ctx.font = "bold 14px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText("CLIQUE PARA REPARAR", axon.x + axon.w / 2, axon.y - 42);
        ctx.fillStyle = "#290711";
        ctx.fillRect(axon.x + axon.w / 2 - 62, axon.y + 36, 124, 12);
        ctx.fillStyle = "#f6d67a";
        ctx.fillRect(axon.x + axon.w / 2 - 58, axon.y + 39, 116 * axon.repair, 6);
      }
    }

    function drawNeuralCapsule(item, now) {
      ctx.fillStyle = "#071123";
      ctx.fillRect(item.x - 20, item.y - 20, 44, 44);
      ctx.fillStyle = item.color;
      ctx.fillRect(item.x - 16, item.y - 16 + Math.sin(now / 260 + item.x) * 3, 32, 32);
      ctx.fillStyle = "#101018";
      ctx.font = "bold 17px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText(item.label, item.x, item.y + 6);
      if ((brainStage === "collect" || brainStage === "repair") && circlesTouch({ x: oligodendrocyte.x, y: oligodendrocyte.y, r: 72 }, { x: item.x, y: item.y, r: 30 })) {
        ctx.fillStyle = "#fff1d2";
        ctx.font = "bold 12px 'Courier New', monospace";
        ctx.fillText("G", item.x, item.y - 28);
      }
    }

    function drawOligodendrocyte(now) {
      if (brainStage === "diagnosis") return;
      ctx.fillStyle = "#12203c";
      circle(oligodendrocyte.x + 5, oligodendrocyte.y + 6, oligodendrocyte.r + 7);
      ctx.fillStyle = "#d6ecff";
      circle(oligodendrocyte.x, oligodendrocyte.y, oligodendrocyte.r);
      ctx.strokeStyle = "#d6ecff";
      ctx.lineWidth = 6;
      for (let i = 0; i < 6; i += 1) {
        const angle = i * 1.05 + now / 420;
        ctx.beginPath();
        ctx.moveTo(oligodendrocyte.x, oligodendrocyte.y);
        ctx.lineTo(oligodendrocyte.x + Math.cos(angle) * 45, oligodendrocyte.y + Math.sin(angle) * 34);
        ctx.stroke();
      }
      ctx.fillStyle = "#fff1d2";
      ctx.font = "bold 13px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText("OLIGODENDROCITO", oligodendrocyte.x, oligodendrocyte.y - 38);
    }

    function drawNeuralImpulse(now) {
      axons.forEach((axon) => {
        const x = axon.x + axon.w * clamp(neuralImpulse, 0, 1);
        const y = axon.y + Math.sin(neuralImpulse * Math.PI * 2) * 18;
        ctx.fillStyle = "#fff7a3";
        circle(x, y, 15 + Math.sin(now / 70) * 4);
        ctx.fillStyle = "#77e8ff";
        circle(x, y, 7);
      });
    }

    function drawBurst(burst) {
      const progress = 1 - burst.life / burst.maxLife;
      ctx.globalAlpha = Math.max(0, burst.life / burst.maxLife);
      burst.parts.forEach((part) => {
        ctx.fillStyle = part.color;
        circle(
          burst.x + part.x * progress,
          burst.y + part.y * progress,
          part.r * (1 - progress * 0.5)
        );
      });
      ctx.globalAlpha = 1;
    }

    function drawGameHud() {
      ctx.fillStyle = "rgba(8, 2, 4, 0.72)";
      ctx.fillRect(12, 12, 690, 54);
      ctx.fillStyle = "#fff1d2";
      ctx.font = "bold 16px 'Courier New', monospace";
      ctx.textAlign = "left";
      if (phase === 1) {
        const left = phase1Viruses.filter((virus) => virus.alive).length;
        ctx.fillText("A/D mover | ESPACO pular | clique: antibiotico | virus: " + left, 24, 44);
      } else if (phase === 2) {
        const left = tbEnemies.filter((enemy) => enemy.alive).length;
        ctx.fillText("ESPACO pular | F coletar | direito: leucocito | cargas: " + scientist.leucocytes + " | TB: " + left, 24, 44);
      } else if (phase === 3) {
        ctx.fillText("A/D mover | ESPACO pular | use os esporos para atravessar", 24, 44);
      } else if (phase === 4) {
        ctx.fillText("SHIFT entrar | A/D navegar | clique: AAS | monocitos: " + scientist.monocytes, 24, 44);
      } else if (phase === 5) {
        ctx.fillText("A/D mover | ESPACO pular | direito: jogar monocitos | monocitos: " + scientist.monocytes, 24, 44);
      } else if (phase === "brainArrival") {
        const left = brainRepairNodes.filter((node) => !node.repaired).length;
        ctx.fillText("A/D mover | encoste nos neuronios | faltam: " + left, 24, 44);
      } else if (phase === 6) {
        const action = brainStage === "diagnosis" ? "aguarde scanner" : brainStage === "collect" ? "aproxime e aperte G" : brainStage === "repair" ? "clique nos axonios vermelhos" : brainStage === "test" ? "teste do impulso" : "concluido";
        ctx.fillText("Fase 5 | " + action + " | L:" + neuralMaterials.lipids + " P:" + neuralMaterials.proteins + " ATP:" + neuralMaterials.atp, 24, 44);
      }
    }

    function drawMessageBox() {
      ctx.fillStyle = "rgba(7, 1, 3, 0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#141015";
      ctx.fillRect(94, 126, 772, 360);
      ctx.strokeStyle = "#e04b3e";
      ctx.lineWidth = 8;
      ctx.strokeRect(94, 126, 772, 360);

      ctx.fillStyle = "#ffded0";
      ctx.font = "bold 34px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText(message.title, W / 2, 190);

      ctx.fillStyle = "#fff1e0";
      ctx.font = "bold 20px 'Courier New', monospace";
      message.lines.forEach((line, index) => {
        wrapText(line, W / 2, 248 + index * 64, 680, 25);
      });

      ctx.fillStyle = "#ffb86b";
      ctx.font = "bold 20px 'Courier New', monospace";
      ctx.fillText(message.button, W / 2, 446);
    }

    function drawDeathScreen(now) {
      ctx.fillStyle = "rgba(8, 1, 3, 0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#121015";
      ctx.fillRect(165, 154, 630, 322);
      ctx.strokeStyle = "#c52834";
      ctx.lineWidth = 10;
      ctx.strokeRect(165, 154, 630, 322);
      ctx.fillStyle = "#e02635";
      ctx.font = "bold 72px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText("VOCE MORREU!!!", W / 2, 292);
      ctx.fillStyle = "#fff1e0";
      ctx.font = "bold 42px 'Courier New', monospace";
      ctx.fillText("TENTE OUTRA VEZ.", W / 2, 388);
      ctx.fillStyle = now % 1000 < 550 ? "#ffebc6" : "#8d2a31";
      ctx.font = "bold 20px 'Courier New', monospace";
      ctx.fillText("ENTER OU ESPACO PARA REINICIAR", W / 2, 433);
    }

    function makeBurst(x, y, color) {
      const parts = [];
      for (let i = 0; i < 16; i += 1) {
        const angle = (Math.PI * 2 * i) / 16;
        const force = 30 + Math.random() * 48;
        parts.push({
          x: Math.cos(angle) * force,
          y: Math.sin(angle) * force,
          r: 4 + Math.random() * 6,
          color: i % 2 ? color : "#fff1d2"
        });
      }
      return { x, y, parts, life: 0.55, maxLife: 0.55 };
    }

    function pixelBand(x, y, blocks) {
      blocks.forEach(([bx, by, bw, bh]) => ctx.fillRect(x + bx, y + by, bw, bh));
    }

    function playerCircle() {
      return {
        x: scientist.x + scientist.w * 0.52,
        y: scientist.y + scientist.h * 0.58,
        r: 36
      };
    }

    function circle(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function circlesTouch(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy) < a.r + b.r;
    }

    function normalize(x, y) {
      const length = Math.hypot(x, y) || 1;
      return { x: x / length, y: y / length };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function cubic(a, b, c, d, t) {
      const nt = 1 - t;
      return nt * nt * nt * a + 3 * nt * nt * t * b + 3 * nt * t * t * c + t * t * t * d;
    }

    function wrapText(text, x, y, maxWidth, lineHeight) {
      const words = text.split(" ");
      let line = "";
      let lineY = y;
      words.forEach((word) => {
        const test = line + word + " ";
        if (ctx.measureText(test).width > maxWidth && line !== "") {
          ctx.fillText(line.trim(), x, lineY);
          line = word + " ";
          lineY += lineHeight;
        } else {
          line = test;
        }
      });
      ctx.fillText(line.trim(), x, lineY);
    }

    requestAnimationFrame((time) => {
      last = time;
      requestAnimationFrame(loop);
    });
  </script>
